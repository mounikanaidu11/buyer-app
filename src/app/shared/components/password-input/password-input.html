<div class="relative">
  <input [id]="inputId()" [type]="visible() ? 'text' : 'password'" [formControl]="control()" class="w-full rounded border px-3 py-2 pr-10"/>
  <button type="button" (click)="toggle()" class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-800" [attr.aria-label]="visible() ? 'Hide password' : 'Show password'">
    @if (visible()) {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
        <line x1="1" y1="1" x2="23" y2="23" />
      </svg>
    }
  </button>
</div>
